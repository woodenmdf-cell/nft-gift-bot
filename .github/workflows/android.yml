name: Android build (Shar Yutar)
on:
  push:
    branches: [shar-yutar]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Icons and splash
        run: npx @capacitor/assets generate --android
      - name: Version, portrait lock
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Sync
        run: npx cap sync android
      - name: Build APK (test) and AAB (store)
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shar-yutar-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab shar-yutar-unsigned.aab
          gh release create "android-${{ github.run_number }}" shar-yutar-test.apk shar-yutar-unsigned.aab \
            --target "${{ github.sha }}" --title "Shar Yutar Android ${{ github.run_number }}" \
            --notes "Avtomatik yig'ilgan: test APK va Play uchun AAB (imzolanmagan)" --prerelease
