<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NFT Bozor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#0f1115);--bg2:var(--tg-theme-secondary-bg-color,#1a1d24);
    --text:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#8a8f98);
    --btn:var(--tg-theme-button-color,#2ea6ff);--btn-text:var(--tg-theme-button-text-color,#fff);
    --rent:#9b5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,system-ui,Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}
  header{padding:14px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:20px;margin-bottom:10px}
  .row{display:flex;gap:8px}
  input,select{width:100%;background:var(--bg2);color:var(--text);border:0;border-radius:12px;padding:12px;font-size:15px;outline:none}
  select{width:110px;flex:none}
  .chips{display:flex;gap:6px;margin-top:8px}
  .chip{background:var(--bg2);border:0;color:var(--text);padding:7px 14px;border-radius:20px;font-size:13px}
  .chip.on{background:var(--btn);color:var(--btn-text)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 16px}
  .card{background:var(--bg2);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .1s;position:relative}
  .card:active{transform:scale(.97)}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;background:#222;display:block}
  .badge{position:absolute;top:8px;left:8px;background:var(--rent);color:#fff;font-size:11px;padding:3px 8px;border-radius:8px;font-weight:600}
  .card .info{padding:8px 10px 10px}
  .card .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .n{color:var(--hint);font-size:12px}
  .price{margin-top:6px;background:var(--btn);color:var(--btn-text);border-radius:10px;text-align:center;padding:6px;font-weight:600;font-size:13px}
  .price.r{background:var(--rent);margin-top:4px}
  .empty{text-align:center;color:var(--hint);padding:50px 20px;grid-column:1/-1}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
  nav button{flex:1;background:none;border:0;color:var(--hint);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button.on{color:var(--btn)} nav span{font-size:20px}
  .page{display:none}.page.on{display:block}
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:10}
  .modal.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet img{width:150px;height:150px;border-radius:18px;display:block;margin:0 auto 10px;object-fit:cover}
  .sheet h2{text-align:center;font-size:20px}.sheet .n{text-align:center;color:var(--hint);margin-bottom:10px}
  .big{width:100%;background:var(--btn);color:var(--btn-text);border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;margin-top:10px}
  .big.r{background:var(--rent);color:#fff}
  .ghost{background:var(--bg2);color:var(--text)}
  .box{background:var(--bg2);border-radius:14px;padding:12px;margin-top:10px}
  .box label{font-size:13px;color:var(--hint);display:block;margin:6px 0 4px}
  .box input{background:var(--bg)}
  .sum{display:flex;justify-content:space-between;font-size:14px;margin-top:6px}
  .sum b{font-size:16px}
  input[type=range]{padding:0;background:none;accent-color:var(--rent)}
  .form{padding:6px 16px;display:flex;flex-direction:column;gap:10px}
  .check{display:flex;align-items:center;gap:10px;font-weight:600}
  .check input{width:20px;height:20px}
  .note{color:var(--hint);font-size:13px;line-height:1.45}
  .order{display:flex;gap:10px;align-items:center;background:var(--bg2);margin:8px 16px;padding:10px;border-radius:14px}
  .order img{width:52px;height:52px;border-radius:10px;object-fit:cover}
  .order .s{font-size:12px;color:var(--hint)} .order b{display:block;font-size:14px}
  .hide{display:none!important}
</style>
</head>
<body>

<div class="page on" id="p-market">
  <header>
    <h1>🎁 NFT sovg'alar bozori</h1>
    <div class="row">
      <input id="q" placeholder="Qidirish: Plush Pepe, #123…">
      <select id="sort"><option value="new">Yangi</option><option value="cheap">Arzon</option><option value="expensive">Qimmat</option></select>
    </div>
    <div class="chips" id="modes">
      <button class="chip on" data-m="all">Hammasi</button>
      <button class="chip" data-m="sale">🛒 Sotuv</button>
      <button class="chip" data-m="rent">🔑 Ijara</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>

<div class="page" id="p-list">
  <header><h1>💸 E'lon berish</h1></header>
  <div class="form">
    <input id="l-link" placeholder="https://t.me/nft/PlushPepe-1234">
    <div class="box">
      <label class="check"><input type="checkbox" id="l-sale" checked> 🛒 Sotish</label>
      <div id="l-sale-f"><label>Sotuv narxi (so'm)</label><input id="l-price" type="number" inputmode="numeric" placeholder="500000"></div>
    </div>
    <div class="box">
      <label class="check"><input type="checkbox" id="l-rent"> 🔑 Ijaraga berish</label>
      <div id="l-rent-f" class="hide">
        <label>1 kunlik ijara narxi (so'm)</label><input id="l-rprice" type="number" inputmode="numeric" placeholder="20000">
        <label>Garov (so'm) — ijarachi qaytarmasa sizga tegadi</label><input id="l-dep" type="number" inputmode="numeric" placeholder="500000">
      </div>
    </div>
    <input id="l-card" inputmode="numeric" placeholder="Pul tushadigan karta: 8600 …">
    <p class="note" id="l-note">Havolani profilingizdagi sovg'a → «Ulashish» orqali oling. E'lon yuborilgach sovg'ani do'kon akkauntiga o'tkazasiz, admin tekshiradi va bozorga chiqaradi.</p>
    <button class="big" id="l-send">E'lonni yuborish</button>
  </div>
</div>

<div class="page" id="p-orders">
  <header><h1>🧾 Buyurtmalarim</h1></header>
  <div id="orders"></div>
</div>

<nav>
  <button class="on" data-p="market"><span>🛍</span>Bozor</button>
  <button data-p="list"><span>💸</span>E'lon berish</button>
  <button data-p="orders"><span>🧾</span>Buyurtmalar</button>
</nav>

<div class="modal" id="modal">
  <div class="sheet">
    <img id="m-img"><h2 id="m-title"></h2><div class="n" id="m-num"></div>
    <button class="big" id="m-buy"></button>
    <div class="box" id="m-rent">
      <div class="sum"><span>🔑 Ijara</span><span id="m-rp"></span></div>
      <label>Muddat: <b id="m-dlabel">1</b> kun</label>
      <input type="range" id="m-days" min="1" max="30" value="1">
      <label>Garov qaytariladigan karta</label>
      <input id="m-card" inputmode="numeric" placeholder="8600 …">
      <div class="sum"><span>Ijara</span><span id="m-s1"></span></div>
      <div class="sum"><span>Garov (qaytariladi)</span><span id="m-s2"></span></div>
      <div class="sum"><span>Jami</span><b id="m-s3"></b></div>
      <button class="big r" id="m-rentbtn">Ijaraga olish</button>
    </div>
    <button class="big ghost" id="m-link">Telegramda ko'rish</button>
    <button class="big ghost" id="m-close">Yopish</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const $ = id => document.getElementById(id);
const som = n => Number(n||0).toLocaleString('ru-RU').replace(/\s|,/g,' ') + " so'm";
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = {waiting_payment:"⏳ To'lov kutilmoqda",checking:"🔎 Tekshirilmoqda",paid:"✅ To'landi, yuborilmoqda",
  delivered:"🎉 Yetkazildi",rented:"🔑 Ijarada",returned:"↩️ Qaytarildi",overdue:"⚠️ Muddati o'tgan",cancelled:"❌ Bekor qilindi"};
const PH = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Crect fill='%23333' width='1' height='1'/%3E%3C/svg%3E";
let cur = null, mode = 'all';
let cfg = {shop:'@admin', commission:5};
fetch('/api/config').then(r=>r.json()).then(c=>{cfg=c;
  $('l-note').textContent = `Havolani profilingizdagi sovg'a → «Ulashish» orqali oling. E'lon yuborilgach sovg'ani ${c.shop} ga o'tkazasiz, admin tekshirib bozorga chiqaradi. Komissiya: ${c.commission}%.`;}).catch(()=>{});

async function post(url, data = {}) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({initData: tg.initData, ...data})});
  if (!r.ok) throw new Error(r.status === 401 ? "Botni Telegram ichida oching" : "Server xatosi");
  return r.json();
}

async function loadGifts() {
  const q = encodeURIComponent($('q').value);
  const gifts = await (await fetch(`/api/gifts?q=${q}&sort=${$('sort').value}&mode=${mode}`)).json();
  const grid = $('grid');
  if (!gifts.length) { grid.innerHTML = '<div class="empty">Hozircha sovg\'alar yo\'q</div>'; return; }
  grid.innerHTML = gifts.map(g => `
    <div class="card" data-id="${g.id}">
      ${g.for_rent ? '<div class="badge">🔑 Ijara</div>' : ''}
      <img src="${esc(g.image)}" onerror="this.src='${PH}'" loading="lazy">
      <div class="info"><div class="t">${esc(g.title)}</div><div class="n">${esc(g.number)}</div>
      ${g.for_sale ? `<div class="price">${som(g.price)}</div>` : ''}
      ${g.for_rent ? `<div class="price r">${som(g.rent_price)}/kun</div>` : ''}</div>
    </div>`).join('');
  grid.querySelectorAll('.card').forEach(el => el.onclick = () => openGift(gifts.find(g => g.id == el.dataset.id)));
}

function calc() {
  const d = +$('m-days').value; $('m-dlabel').textContent = d;
  $('m-s1').textContent = som(cur.rent_price * d);
  $('m-s2').textContent = som(cur.deposit);
  $('m-s3').textContent = som(cur.rent_price * d + cur.deposit);
}
function openGift(g) {
  cur = g;
  $('m-img').src = g.image; $('m-img').onerror = function(){this.src=PH};
  $('m-title').textContent = g.title; $('m-num').textContent = g.number || '';
  $('m-buy').classList.toggle('hide', !g.for_sale);
  $('m-buy').textContent = `🛒 Sotib olish — ${som(g.price)}`;
  $('m-rent').classList.toggle('hide', !g.for_rent);
  $('m-rp').textContent = som(g.rent_price) + '/kun';
  $('m-days').value = 1; calc();
  $('modal').classList.add('on');
  tg.HapticFeedback?.impactOccurred('light');
}
const closeModal = () => $('modal').classList.remove('on');
$('m-close').onclick = closeModal;
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
$('m-link').onclick = () => cur?.link && tg.openTelegramLink(cur.link);
$('m-days').oninput = calc;

async function order(data, question) {
  tg.showConfirm(question, async ok => {
    if (!ok) return;
    try {
      const r = await post('/api/order', data);
      if (r.ok) { tg.HapticFeedback?.notificationOccurred('success');
        tg.showAlert("To'lov ma'lumotlari botga yuborildi. To'lab, chekni botga jo'nating.", () => tg.close()); }
      else tg.showAlert(r.error);
    } catch (e) { tg.showAlert(e.message); }
    closeModal(); loadGifts();
  });
}
$('m-buy').onclick = () => order({kind:'buy', gift_id:cur.id}, `${cur.title} ${cur.number||''} ni ${som(cur.price)} ga sotib olasizmi?`);
$('m-rentbtn').onclick = () => {
  const d = +$('m-days').value;
  order({kind:'rent', gift_id:cur.id, days:d, card:$('m-card').value},
    `${cur.title} ni ${d} kunga ijaraga olasizmi? Jami: ${som(cur.rent_price*d + cur.deposit)} (garov qaytariladi)`);
};

$('l-sale').onchange = () => $('l-sale-f').classList.toggle('hide', !$('l-sale').checked);
$('l-rent').onchange = () => $('l-rent-f').classList.toggle('hide', !$('l-rent').checked);
$('l-send').onclick = async () => {
  try {
    const r = await post('/api/list', {link:$('l-link').value.trim(), for_sale:$('l-sale').checked, for_rent:$('l-rent').checked,
      price:$('l-price').value, rent_price:$('l-rprice').value, deposit:$('l-dep').value, card:$('l-card').value});
    if (r.ok) { tg.showAlert("E'lon yuborildi! Ko'rsatmalar botda."); ['l-link','l-price','l-rprice','l-dep'].forEach(i=>$(i).value=''); }
    else tg.showAlert(r.error);
  } catch (e) { tg.showAlert(e.message); }
};

async function loadOrders() {
  const box = $('orders');
  try {
    const list = await post('/api/orders');
    box.innerHTML = list.length ? list.map(o => {
      const end = o.ends_at && o.status === 'rented' ? ` · ⏰ ${new Date(o.ends_at*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} gacha` : '';
      return `<div class="order"><img src="${esc(o.image)}" onerror="this.src='${PH}'">
      <div><b>${o.kind==='rent'?'🔑':'🛒'} ${esc(o.title)} ${esc(o.number)}</b>
      <div class="s">#${o.id} · ${som(o.price)}${o.kind==='rent' ? ` · ${o.days} kun` : ''}</div>
      <div class="s">${STATUS[o.status] || o.status}${end}</div></div></div>`; }).join('')
      : '<div class="empty">Buyurtmalar yo\'q</div>';
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.p));
  if (b.dataset.p === 'orders') loadOrders();
  if (b.dataset.p === 'market') loadGifts();
});
document.querySelectorAll('#modes .chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('#modes .chip').forEach(x => x.classList.toggle('on', x === c));
  mode = c.dataset.m; loadGifts();
});
let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(loadGifts, 300); };
$('sort').onchange = loadGifts;
loadGifts();
</script>
</body>
</html>
