<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin panel — Shahar Arena</title>
<style>
  :root{--bg:#0d0f14;--bg2:#161a22;--bg3:#1f2430;--line:#2a3040;--text:#e8eaf0;--hint:#8a91a3;
        --acc:#2ea6ff;--ok:#2ecc71;--bad:#ff5c5c;--warn:#ffb020;--rent:#9b5cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  button{cursor:pointer;font:inherit}
  input,select,textarea{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--acc)}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}
  .btn.s{padding:6px 10px;font-size:12px}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
  .btn.g{background:var(--bg3);color:var(--text);border:1px solid var(--line)}.btn.r{background:var(--rent)}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .lbox{background:var(--bg2);padding:28px;border-radius:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
  .lbox h1{font-size:22px;text-align:center}
  /* layout */
  #app{display:none;min-height:100vh}
  aside{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px}
  aside .logo{font-weight:700;font-size:17px;padding:4px 10px 16px}
  aside a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;color:var(--hint);text-decoration:none;cursor:pointer}
  aside a.on,aside a:hover{background:var(--bg3);color:var(--text)}
  .cnt{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
  .cnt:empty{display:none}
  main{margin-left:220px;padding:24px;max-width:1300px}
  h2{font-size:22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .v{font-size:24px;font-weight:700;margin-top:6px}.stat .k{color:var(--hint);font-size:13px}
  .bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.bar>*{width:auto;min-width:140px}
  table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:14px;overflow:hidden}
  th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--hint);font-weight:500;font-size:12px;text-transform:uppercase;background:var(--bg3)}
  tr:last-child td{border-bottom:0}
  td img.th{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--bg3)}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg3)}
  .t-waiting,.t-pending,.t-reserved,.t-need_link{color:var(--warn)}.t-checking,.t-linking,.t-paid{color:var(--acc)}
  .t-delivered,.t-ok,.t-active,.t-sold{color:var(--ok)}
  .t-rented{color:var(--rent)}.t-ended,.t-cancelled,.t-rejected{color:var(--bad)}
  .muted{color:var(--hint);font-size:12px}
  .empty{padding:40px;text-align:center;color:var(--hint);background:var(--bg2);border-radius:14px}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal.on{display:flex}
  .mbox{background:var(--bg2);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .mbox h3{font-size:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mbox label{font-size:12px;color:var(--hint);display:block;margin-bottom:4px}
  .ck{display:flex;gap:8px;align-items:center}.ck input{width:18px;height:18px}
  .mbox img.big{max-width:100%;border-radius:12px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:12px 18px;border-radius:12px;display:none;z-index:30}
  .menu-btn{display:none}
  @media(max-width:800px){
    aside{transform:translateX(-100%);transition:.2s;z-index:15;width:240px}aside.open{transform:none}
    main{margin-left:0;padding:14px}.menu-btn{display:inline-block}
    table,thead,tbody,tr,td{display:block}thead{display:none}
    tr{border-bottom:1px solid var(--line);padding:8px 0}td{border:0;padding:5px 12px}
    td[data-l]::before{content:attr(data-l)": ";color:var(--hint);font-size:12px}
  }
</style>
</head>
<body>
<div id="login"><div class="lbox">
  <h1>🎮 Shahar Arena</h1>
  <div class="muted" style="text-align:center">Admin panel. Botga /admin yozsangiz parolsiz kirish havolasi keladi.</div>
  <input id="pw" type="password" placeholder="Parol" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Kirish</button>
</div></div>

<div id="app">
  <aside id="side">
    <div class="logo">🎮 Shahar Arena</div>
    <a data-v="dash" class="on">📊 Boshqaruv</a>
    <a data-v="topups">💳 Balans to'ldirish <span class="cnt" id="c-top"></span></a>
    <a data-v="users">👥 Foydalanuvchilar</a>
    <a data-v="broadcast">📢 Xabar yuborish</a>
    <a href="/admin/api/backup">💾 Zaxira nusxa (.db)</a>
    <a onclick="logout()" style="margin-top:auto">🚪 Chiqish</a>
  </aside>
  <main id="main"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const som = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm";
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = t => t ? new Date(t * 1000).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2500); }
async function api(path, body) {
  const r = await fetch('/admin/api/' + path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (r.status === 401) { $('app').style.display = 'none'; $('login').style.display = 'flex'; throw new Error('login'); }
  return r.json();
}
async function login() {
  const r = await (await fetch('/admin/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: $('pw').value})})).json();
  if (r.ok) start(); else toast(r.error);
}
async function logout() { await fetch('/admin/logout', {method: 'POST'}); location.reload(); }
function closeM() { $('modal').classList.remove('on'); }
function modal(h) { $('mbox').innerHTML = h; $('modal').classList.add('on'); }
const head = t => `<h2><span><button class="btn g menu-btn" onclick="$('side').classList.toggle('open')">☰</button> ${t}</span>`;

const V = {};
let view = 'dash';
V.dash = async () => {
  const s = await api('stats');
  const card = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return head('📊 Boshqaruv') + '</h2><div class="stats">' +
    card('👥 Foydalanuvchilar', s.users) + card('🎮 O\'yinchilar', s.players) + card('📅 Bugun bonus olganlar', s.active_day) + card('👑 Faol VIP', s.vip_active) +
    card('💰 O\'yin daromadi', som(s.game_revenue)) + card('👑 VIP daromadi', som(s.vip_revenue)) + card('🪙 Tanga sotuvi', som(s.coin_revenue)) +
    card('💳 Jami to\'ldirilgan', som(s.topped)) + card('👛 Foydalanuvchi balanslari', som(s.balances)) + card('🔎 Chek tekshiruvi', s.topups_checking) +
    '</div>';
};
V.topups = async () => {
  const rows = await api('topups');
  let h = head('💳 Balans to\'ldirish') + '</h2>';
  if (!rows.length) return h + '<div class="empty">Hozircha yo\'q</div>';
  h += '<table><thead><tr><th>#</th><th>Foydalanuvchi</th><th>Summa</th><th>Holat</th><th>Vaqt</th><th></th></tr></thead><tbody>';
  for (const t of rows) {
    h += `<tr><td>${t.id}</td><td>${esc(t.full_name || '')} <span class="muted">@${esc(t.username || '-')} · ${t.user_id}</span></td>
      <td><b>${som(t.amount)}</b>${t.bonus ? `<div class="muted">+${som(t.bonus)} cashback</div>` : ''}</td>
      <td><span class="tag t-${t.status}">${t.status}</span></td><td class="muted">${dt(t.created)}</td><td><div class="acts">
      ${t.receipt_file ? `<button class="btn g s" onclick="showRc('${t.receipt_file}')">🧾 Chek</button>` : ''}
      ${t.status === 'checking' ? `<button class="btn ok s" onclick="tAct(${t.id},'ok',${t.amount})">✅</button><button class="btn bad s" onclick="tAct(${t.id},'no')">❌</button>` : ''}
      </div></td></tr>`;
  }
  return h + '</tbody></table>';
};
function showRc(fid) { modal(`<h3>🧾 Chek</h3><img class="big" src="/admin/api/file/${encodeURIComponent(fid)}"><button class="btn g" onclick="closeM()">Yopish</button>`); }
async function tAct(id, act, amount) {
  let body = {};
  if (act === 'ok') { const v = prompt('Tasdiqlanadigan summa (so\'m):', amount); if (v === null) return; body.amount = +v; }
  else if (!confirm('Rad etilsinmi?')) return;
  const r = await api(`topups/${id}/${act}`, body); toast(r.msg || r.error); render();
}
V.users = async () => {
  const rows = await api('users');
  let h = head('👥 Foydalanuvchilar') + `<input placeholder="Qidirish..." style="max-width:240px" oninput="filterU(this.value)"></h2>`;
  h += '<table><thead><tr><th>ID</th><th>Ism</th><th>Balans</th><th>Tanga</th><th>VIP</th><th>Sarflagan</th><th></th></tr></thead><tbody id="ub">';
  const now = Date.now() / 1000;
  for (const u of rows) {
    h += `<tr data-s="${esc((u.full_name || '') + ' ' + (u.username || '') + ' ' + u.id).toLowerCase()}"><td>${u.id}</td>
      <td>${esc(u.full_name || '')} <span class="muted">@${esc(u.username || '-')}</span></td><td>${som(u.balance)}</td><td>🪙 ${u.coins || 0}</td>
      <td>${u.vip_until > now ? '👑 ' + new Date(u.vip_until * 1000).toLocaleDateString('ru-RU') : '—'}</td><td>${som(u.spent)}</td><td><div class="acts">
      <button class="btn g s" onclick="bal(${u.id})">💰 Balans</button><button class="btn g s" onclick="coins(${u.id})">🪙 Tanga</button>
      <button class="btn ${u.banned ? 'ok' : 'bad'} s" onclick="ban(${u.id},${u.banned ? 0 : 1})">${u.banned ? 'Blokdan chiqarish' : 'Bloklash'}</button></div></td></tr>`;
  }
  return h + '</tbody></table>';
};
function filterU(q) { q = q.toLowerCase(); document.querySelectorAll('#ub tr').forEach(r => r.style.display = r.dataset.s.includes(q) ? '' : 'none'); }
async function bal(id) { const v = prompt('Balansga qo\'shiladigan summa (ayirish uchun minus):'); if (!v) return; const r = await api(`users/${id}/balance`, {delta: +v}); toast(r.msg || r.error); render(); }
async function coins(id) { const v = prompt('Qo\'shiladigan tanga (ayirish uchun minus):'); if (!v) return; const r = await api(`users/${id}/coins`, {delta: +v}); toast(r.msg || r.error); render(); }
async function ban(id, v) { if (!confirm(v ? 'Bloklansinmi?' : 'Blokdan chiqarilsinmi?')) return; await api(`users/${id}/ban`, {banned: !!v}); render(); }
V.broadcast = async () => head('📢 Xabar yuborish') + `</h2><div class="stat" style="max-width:640px;display:flex;flex-direction:column;gap:10px">
  <textarea id="bt" rows="6" placeholder="Hamma foydalanuvchilarga yuboriladigan matn (HTML: <b>qalin</b>, <i>kursiv</i>)"></textarea>
  <div class="muted">Xabar ostiga «🎮 O'ynash» tugmasi qo'shiladi.</div>
  <button class="btn" onclick="bcast()">📢 Yuborish</button></div>`;
async function bcast() { const t = $('bt').value.trim(); if (!t || !confirm('Hammaga yuborilsinmi?')) return; const r = await api('broadcast', {text: t}); toast(r.msg || r.error); }

async function render() {
  document.querySelectorAll('aside a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  try { $('main').innerHTML = await V[view](); } catch (e) { if (e.message !== 'login') $('main').innerHTML = '<div class="empty">Xato: ' + esc(e.message) + '</div>'; }
  try { const s = await api('stats'); $('c-top').textContent = s.topups_checking || ''; } catch (e) {}
}
document.querySelectorAll('aside a[data-v]').forEach(a => a.onclick = () => { view = a.dataset.v; $('side').classList.remove('open'); render(); });
async function start() {
  try { await api('stats'); } catch (e) { return; }
  $('login').style.display = 'none'; $('app').style.display = 'block'; render();
  setInterval(() => { if (view === 'topups' || view === 'dash') render(); }, 30000);
}
start();
</script>
</body>
</html>
